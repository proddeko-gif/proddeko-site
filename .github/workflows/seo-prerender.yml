
name: Verification du prerendu SEO

on:
  push:
    branches:
      - seo-prerender
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dependances
        run: npm install

      - name: Installer Chromium et ses dependances
        run: npx playwright install --with-deps chromium

      - name: Construire et prerendre les pages
        run: |
          npm run build
          node scripts/prerender.mjs

     
      - name: Verifier les pages generees
        run: |
          echo "=== Fichiers HTML produits ==="
          find dist -type f -name "*.html" -print
          echo "=== Verification de la page d'accueil ==="
          test -f dist/index.html
          echo "=== Verification des projets ==="
          test -f dist/projets/index.html
          echo "=== Verification des programmes ==="
          test -f dist/programmes/index.html
          echo "=== Verification du contact ==="
          test -f dist/contact/index.html

      - name: Verifier la balise canonique des projets
        run: |
          grep -q 'https://proddeko.online/projets/' dist/projets/index.html
